name: Feature request
description: Suggest an improvement or new capability
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Fake API / DSL sketch welcome.
      render: ruby
    validations:
      required: false
  - type: dropdown
    id: use_case
    attributes:
      label: Use-case category
      options:
        - Support / Q&A agent
        - Lead / sales workflow
        - Research / web search
        - Document generation (xlsx/pptx/pdf)
        - Ops / monitoring
        - Internal tools / admin
        - Other
    validations:
      required: true
